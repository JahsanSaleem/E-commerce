services:
  database:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: ECOM
      MYSQL_USER: store
      MYSQL_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Set MYSQL_ROOT_PASSWORD in .env}
    volumes:
      - store-data:/var/lib/mysql
      - ./backend/db/schema.sql:/docker-entrypoint-initdb.d/001-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "MYSQL_PWD=$$MYSQL_PASSWORD mysql -u store -h 127.0.0.1 -D ECOM -e 'SELECT 1'"]
      interval: 5s
      timeout: 3s
      retries: 30
  backend:
    build: ./backend
    depends_on:
      database:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: prod
      DB_URL: jdbc:mysql://database:3306/ECOM
      DB_USERNAME: store
      DB_PASSWORD: ${DB_PASSWORD}
      FRONTEND_ORIGINS: http://localhost:8080
      UPLOAD_DIR: /app/uploads
      DELIVERY_FEE: ${DELIVERY_FEE:-249.00}
      COOKIE_SECURE: "false"
      GOOGLE_LOGIN_ENABLED: ${GOOGLE_LOGIN_ENABLED:-false}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      GOOGLE_REDIRECT_URI: ${GOOGLE_REDIRECT_URI:-http://localhost:8080/login/oauth2/code/google}
      GOOGLE_FRONTEND_URL: ${GOOGLE_FRONTEND_URL:-http://localhost:8080}
      SMTP_HOST: ${SMTP_HOST:-smtp-relay.brevo.com}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_LOGIN: ${SMTP_LOGIN:-}
      SMTP_KEY: ${SMTP_KEY:-}
      MAIL_FROM: ${MAIL_FROM:-}
      BOOTSTRAP_ADMIN_ENABLED: "true"
      INITIAL_ADMIN_EMAIL: ${INITIAL_ADMIN_EMAIL:-admin@mustafa.com}
      INITIAL_ADMIN_PASSWORD: ${INITIAL_ADMIN_PASSWORD:?Set a strong INITIAL_ADMIN_PASSWORD in .env}
    volumes:
      - product-images:/app/uploads
  frontend:
    build: ./frontend
    depends_on:
      - backend
    ports:
      - "127.0.0.1:8080:80"
volumes:
  store-data:
  product-images:
