spring.datasource.url=jdbc:h2:mem:storetest;MODE=MySQL;DB_CLOSE_DELAY=-1;NON_KEYWORDS=USER
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# Tests must never send mail using the ignored local provider configuration.
spring.mail.username=
spring.mail.password=
store.mail.from=

store.mail.provider=smtp
store.mail.brevo-api-key=
store.images.provider=local
store.images.cloudinary.api-key=
store.images.cloudinary.api-secret=
