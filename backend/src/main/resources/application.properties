spring.config.import=optional:file:./src/main/resources/application-local.properties,optional:file:./backend/src/main/resources/application-local.properties
spring.datasource.url=jdbc:mysql://localhost:3306/ECOM
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
server.port=8081

server.error.include-stacktrace=never
server.error.include-message=never
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax

# Optional Google login; credentials belong in ignored local configuration or environment variables.
store.google.enabled=${GOOGLE_LOGIN_ENABLED:false}
store.google.client-id=${GOOGLE_CLIENT_ID:}
store.google.client-secret=${GOOGLE_CLIENT_SECRET:}
store.google.redirect-uri=${GOOGLE_REDIRECT_URI:http://localhost:8081/login/oauth2/code/google}
store.google.frontend-url=${GOOGLE_FRONTEND_URL:http://localhost:5173}

# Registration-only email OTP. Actual credentials must stay outside Git.
spring.mail.host=${SMTP_HOST:smtp-relay.brevo.com}
spring.mail.port=${SMTP_PORT:587}
spring.mail.username=${SMTP_LOGIN:}
spring.mail.password=${SMTP_KEY:}
store.mail.from=${MAIL_FROM:}

# Product uploads are local files; use a persistent volume in deployment.
store.upload-dir=${UPLOAD_DIR:uploads}
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB
store.delivery-fee=${DELIVERY_FEE:249.00}

# Hosted delivery uses HTTPS APIs; local SMTP and filesystem remain defaults.
store.mail.provider=${MAIL_PROVIDER:smtp}
store.mail.brevo-api-key=${BREVO_API_KEY:}
store.images.provider=${IMAGE_PROVIDER:local}
store.images.cloudinary.cloud-name=${CLOUDINARY_CLOUD_NAME:}
store.images.cloudinary.api-key=${CLOUDINARY_API_KEY:}
store.images.cloudinary.api-secret=${CLOUDINARY_API_SECRET:}
