spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.open-in-view=true
server.port=${PORT:8081}
server.forward-headers-strategy=framework
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=${COOKIE_SAME_SITE:lax}
server.servlet.session.cookie.secure=${COOKIE_SECURE:true}
server.servlet.session.timeout=30m
server.error.include-stacktrace=never
server.error.include-message=never
store.cors.origins=${FRONTEND_ORIGINS}
store.bootstrap-admin.enabled=${BOOTSTRAP_ADMIN_ENABLED:false}
store.bootstrap-admin.email=${INITIAL_ADMIN_EMAIL:admin@mustafa.com}
store.bootstrap-admin.password=${INITIAL_ADMIN_PASSWORD:}
store.bootstrap-admin.minimum-password-length=12

# Aiven TLS truststore password; empty for other production database providers.
spring.datasource.hikari.data-source-properties.trustCertificateKeyStorePassword=${AIVEN_TRUSTSTORE_PASSWORD:}
